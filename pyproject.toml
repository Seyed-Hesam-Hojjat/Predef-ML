[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-ml-workbench"
version = "0.1.0"
description = "A guided local-first workflow for tabular machine learning with data audits, cross-validation, and held-out evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tabular ML Workbench contributors"}]
dependencies = [
  "streamlit>=1.40,<2.0",
  "pandas>=2.1,<4.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.11,<2.0",
  "openpyxl>=3.1,<4.0",
  "xlrd>=2.0,<3.0",
  "joblib>=1.3,<2.0",
]

[tool.setuptools.packages.find]
include = ["ml_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
